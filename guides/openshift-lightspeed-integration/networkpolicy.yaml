apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-acs-to-lightspeed
  namespace: openshift-lightspeed
spec:
  podSelector:
    matchLabels:
      app.kubernetes.io/part-of: openshift-lightspeed
  policyTypes:
    - Ingress
  ingress:
    - from:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: stackrox
          podSelector:
            matchLabels:
              app: central
      ports:
        - protocol: TCP
          port: 8443
